[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qecbench"
version = "0.1.0"
description = "Hardware benchmarks of QEC primitives (mid-circuit measurement + feed-forward) on IBM and IQM devices"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "networkx",
    "matplotlib",
    "qiskit>=2.0",
    "qiskit-aer>=0.17",
]

[project.optional-dependencies]
ibm = ["qiskit-ibm-runtime>=0.40"]
iqm = ["qiskit-braket-provider>=0.11", "amazon-braket-sdk>=1.111"]
quantinuum = ["guppylang>=1.1", "qnexus>=0.49"]
qec = ["stim>=1.14", "pymatching>=2.2"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qecbench = ["devices/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
