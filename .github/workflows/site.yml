# Rebuilds and publishes the results website (site/) to GitHub Pages whenever results, the site, or the
# code that reads the results change on main. One-time setup:
#   GitHub repo -> Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Publish website

on:
  push:
    branches: [main]
    paths:
      - "data/results/**"
      - "site/**"
      - "src/qecbench/**"
      - "scripts/build_site_data.py"
      - "scripts/site_devices.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# queue deploys instead of cancelling, so an older version never ends up live
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Process results into site/data/results.json
        run: python scripts/build_site_data.py
      - name: Stamp asset links with the commit, so browsers never mix old and new files
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
